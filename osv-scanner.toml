[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-04T00:00:00Z
reason = """glob 10.x/13.x keeps walking the file system after an AbortSignal fires; fixed only in \
14.0.2 (new major, published 2026-10-27). glob ^13 is pinned by @backstage/cli*, \
@backstage/plugin-catalog-backend, cacache and ts-json-schema-generator; glob ^10 by jest 30, \
@rollup/plugin-commonjs and archiver-utils. None of the Backstage callers pass a signal to glob \
(checked in node_modules), so the bypassed cancel path is not used; patterns come from this repo's \
config, not request input. Not forcing a major across Backstage packages. Re-check when Backstage \
moves to glob 14."""

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-04T00:00:00Z
reason = """minimatch pattern amplification DoS (globparts **/../ growth at optimizationLevel >= 2); \
fixed only in 11.0.1 (new major, published 2026-10-27). minimatch ^10 is pinned by \
@backstage/backend-defaults, plugin-auth-backend, plugin-catalog-backend, mcp-actions-backend and \
typescript-eslint; ^3/^5/^9 by ESLint 8 plugins, glob 7/8/10 and dev tooling. The trigger is an \
