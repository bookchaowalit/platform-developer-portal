# Reviewed OSV-Scanner exceptions. Each entry needs a reason and an expiry.
# Context: Backstage 1.56.5 (see backstage.json). Every advisory below
# either has no fixed release at all, or is fixed only in a new major version of a transitive
# dependency that the Backstage packages pin to an older major. Overriding those across a
# major would change APIs inside Backstage code we do not own. Re-check on each Backstage
# release bump (Renovate) and at the expiry date.

[[IgnoredVulns]]
id = "GHSA-848j-6mx2-7j84"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """elliptic 6.6.1 truncates RFC 6979 k by k's own byte length. No fixed release exists, so the \
portal ships .yarn/patches/elliptic-npm-6.6.1-*.patch (truncate by n.byteLength() * 8, the upstream \
fix shape); packages/backend/src/patchedDeps.test.ts checks it. The lockfile still says 6.6.1, so the \
scanner keeps matching. Drop the patch and this ignore when elliptic ships a fix."""

[[IgnoredVulns]]
id = "GHSA-337j-9hxr-rhxg"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """react-router constructor injection in deserializeErrors() during SSR hydration; fixed only \
in 7.18.0. The portal is a client-rendered SPA (no React Router framework/SSR mode), so the \
vulnerable hydration path is not used. Backstage's frontend still requires react-router 6; a v7 \
move must follow Backstage's own migration."""

[[IgnoredVulns]]
id = "GHSA-wrjc-x8rr-h8h6"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """react-router open redirect via backslash paths in <Link>/useNavigate; fixed only in 7.18.0. \
Backstage's frontend framework still requires react-router 6 (no 6.x fix exists). The app's own \
routes are static; risk is limited to plugins navigating to attacker-supplied paths. Tracked as \
known debt until Backstage supports react-router 7."""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """deepmerge <=4.3.1 mergeObject() copies an own "__proto__" key and so sets the result's \
prototype. No fixed release exists, so the portal ships .yarn/patches/deepmerge-npm-4.3.1-*.patch \
(getKeys() drops "__proto__"); packages/backend/src/patchedDeps.test.ts checks it. The lockfile \
still says 4.3.1, so the scanner keeps matching. Drop the patch and this ignore when deepmerge ships a fix."""
